name: Build Signed Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Ensure Android platform assets exist
        run: |
          mkdir -p dist
          echo "<html><body>Church Companion</body></html>" > dist/index.html

      - name: Sync Capacitor Android project
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee cap-sync-debug.log

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/churchcompanion-release.keystore"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/churchcompanion-release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease 2>&1 | tee ../gradle-build-debug.log

      - name: Report failure details to a GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Run: ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            echo
            echo "## cap-sync-debug.log"
            echo '```'
            tail -c 40000 cap-sync-debug.log 2>/dev/null || echo "(no file)"
            echo '```'
            echo
            echo "## gradle-build-debug.log"
            echo '```'
            tail -c 40000 gradle-build-debug.log 2>/dev/null || echo "(no file)"
            echo '```'
          } > /tmp/issue-body.md
          jq -n --rawfile body /tmp/issue-body.md \
            '{title:"CI Debug: workflow failure run '"${{ github.run_id }}"'", body:$body}' > /tmp/issue.json
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d @/tmp/issue.json

      - name: Clean up keystore from filesystem
        if: always()
        run: rm -f "$RUNNER_TEMP/churchcompanion-release.keystore"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: churchcompanion-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: Church Companion v${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
